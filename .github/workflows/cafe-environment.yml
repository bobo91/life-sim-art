name: Cafe Environment Pack

on:
  pull_request:
    paths:
      - 'scripts/*cafe*'
      - 'configs/*cafe*'
      - 'configs/prop_tin_001.json'
      - 'docs/props/CAFE_ENVIRONMENT_PACK.md'
      - '.github/workflows/cafe-environment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cafe-build-and-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install portable compositor dependency
        run: python -m pip install Pillow==12.3.0
      - name: Install official pinned Blender and verify checksum
        shell: bash
        run: |
          curl --fail --location --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz --output "$RUNNER_TEMP/blender.tar.xz"
          printf '%s  %s\n' '9ba871ff2ecd36526b77432745980b7e6664ecd0c7ca11c48849073dcfe06da3' "$RUNNER_TEMP/blender.tar.xz" | sha256sum --check -
          tar --extract --file "$RUNNER_TEMP/blender.tar.xz" --directory "$RUNNER_TEMP"
          printf 'BLENDER_BIN=%s\n' "$RUNNER_TEMP/blender-4.5.14-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Generate and validate original cafe pack
        shell: bash
        run: |
          "$BLENDER_BIN" --background --factory-startup --offline-mode --disable-autoexec --threads 4 --python-exit-code 1 --python scripts/build_cafe_environment.py -- --output build/cafe-environment/ci-preflight --geometry-only
          python scripts/run_cafe_environment.py --blender "$BLENDER_BIN" --output build/cafe-environment/ci-review --preflight build/cafe-environment/ci-preflight
          python scripts/compose_cafe_environment.py --input build/cafe-environment/ci-review --output build/cafe-environment/ci-sheets --font default
          python scripts/package_cafe_environment.py --input build/cafe-environment/ci-review --sheets build/cafe-environment/ci-sheets --output build/artifacts/cafe-environment-pack-v0.1.0-review.1.zip
      - name: Publish versioned GLB and editable Blender review package
        uses: actions/upload-artifact@v4
        with:
          name: cafe-environment-pack-v0.1.0-${{ github.sha }}-${{ github.run_attempt }}
          path: build/artifacts/cafe-environment-pack-v0.1.0-review.1.zip*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
